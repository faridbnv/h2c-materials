<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filament Atlas</title>
<!-- An icon of its own, inline so the page stays one file: without it every browser asked the server for
     /favicon.ico, which the published site does not have (a 404 on each load). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5f8b'/%3E%3Cpath d='M9 22h14M11 16.5h10M13 11h6' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- The first stop for a keyboard, shown when it has focus. Without it the first row was 68 presses away. -->
<a class="skip-link" id="skip-link" href="#lens">Skip to results</a>
<div class="app">

  <header class="topbar">
    <button class="btn btn-sm btn-icon" id="btn-filters" aria-controls="rail" aria-expanded="false"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h8M15 5.5h2M3 14.5h2M9 14.5h8"/><circle cx="13" cy="5.5" r="2"/><circle cx="7" cy="14.5" r="2"/></svg>Filters</button>
    <!-- The name says what the tool is, not which printer it was first built for; the H2C is named where it decides
         something (the rail's Printing on the H2C, the gates). The mark is three printed layers. -->
    <h1 class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M9 22h14M11 16.5h10M13 11h6"/></svg><span class="brand-name">Filament Atlas</span></h1>
    <div class="search">
      <svg class="icon search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
      <input type="search" id="search" placeholder="Material, maker or product" aria-label="Search materials" aria-keyshortcuts="/">
      <kbd class="search-key" aria-hidden="true" title="Press / to search">/</kbd>
    </div>
    <div class="spacer"></div>

    <!-- The most consequential control in the product. Top level, never inside a filter group.
         It carries its own label and its own consequence: the meaning used to live only in a
         tooltip and in a monospace line at the far corner of the screen that read like a log. -->
    <!-- The two settings that decide what missing data does, in one panel: they used to read as five unrelated boxes. -->
    <div class="data-settings">
    <div class="mode-group">
      <span class="mode-label" id="mode-label"><span class="mode-label-long">Materials with missing data</span><span class="mode-label-short">Missing data</span></span>
      <div class="segmented" role="group" aria-labelledby="mode-label">
        <button id="mode-strict" aria-pressed="true" title="Show only materials confirmed to meet every requirement.">Confirmed only</button>
        <button id="mode-explore" aria-pressed="false" title="Also show materials that may qualify but still need verification. Estimates and a base polymer's published behaviour can screen out clear mismatches.">Include uncertain</button>
      </div>
    </div>

    <!-- Shown in both modes. Under Confirmed only it is disabled and says why beside it; it used to be hidden, so a
         reader in the default mode never learned estimates exist. What the switch governs sits one press away. One
         switch governs all inference: estimates of missing numbers and a base polymer's published behaviour (D64). The
         element ids and the scenario field keep their names, so links and the fuzz keep working. -->
    <div class="est-group">
      <div class="est-line">
        <label class="est-toggle" id="est-toggle">
          <input type="checkbox" id="use-estimates" aria-describedby="est-reason"><span>Let estimates rule out materials</span></label>
        <button type="button" class="mark info-mark" aria-label="What estimates and polymer data are" aria-haspopup="dialog" aria-expanded="false"
          data-explain-head="Let estimates rule out materials"
          data-explain="Where a material publishes nothing, the tool can estimate the value from related values and similar materials, and can read its base polymer's resin reference data for chemicals. Neither ever makes a material pass. With this on, an estimate excludes a material only when its whole plausible range misses the requirement, and resin data only when it reports the polymer attacked or dissolved. It works only under Include uncertain; Confirmed only uses each material's own data alone."
          title="Where a material publishes nothing, the tool can estimate the value from related values and similar materials, and can read its base polymer's resin reference data for chemicals. Neither ever makes a material pass. With this on, an estimate excludes a material only when its whole plausible range misses the requirement, and resin data only when it reports the polymer attacked or dissolved. It works only under Include uncertain; Confirmed only uses each material's own data alone.">?</button>
      </div>
      <span class="est-reason" id="est-reason">Only under Include uncertain</span>
      <span class="est-ruled" id="est-ruled" hidden></span>
    </div>
    </div>

    <!-- Words where the bar has room, an icon where it has not; the words stay the accessible name and the title. -->
    <button class="btn btn-sm btn-icon" id="btn-scenario" aria-label="Save / share" title="Export, save, load or share this selection"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 12.5V3M6.5 6.5L10 3l3.5 3.5M4.5 10.5v6h11v-6"/></svg><span class="btn-text">Save / share</span></button>
    <button type="button" class="btn btn-sm btn-icon" id="btn-theme"><svg class="icon theme-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z"/></svg><svg class="icon theme-sun" viewBox="0 0 20 20" aria-hidden="true" hidden><circle cx="10" cy="10" r="3.5"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6L16 16M4 16l1.4-1.4M14.6 5.4L16 4"/></svg><span class="btn-text"></span></button>
  </header>

  <div class="main" id="main">
    <div class="rail-backdrop" id="rail-backdrop"></div>
    <aside class="rail" id="rail" aria-label="Filters">
      <div class="rail-head">
        <h2><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h8M15 5.5h2M3 14.5h2M9 14.5h8"/><circle cx="13" cy="5.5" r="2"/><circle cx="7" cy="14.5" r="2"/></svg>Filters</h2>
        <button class="text-btn" id="btn-reset" title="Removes every requirement. Part condition, search, shortlist and view stay as they are.">Clear requirements</button>
        <button class="icon-btn btn-icon" id="btn-rail-hide" aria-label="Hide filters" title="Hide the filters to widen the results. Filters, in the top bar, brings them back."><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M8 4v12M13.5 8L11.5 10l2 2"/></svg></button>
        <button class="icon-btn" id="btn-rail-close" aria-label="Close filters">✕</button>
      </div>
      <div id="filter-groups"></div>
    </aside>

    <section class="workspace">
      <div class="lens-bar">
        <span class="candidate-count" id="count"></span>
        <div class="spacer"></div>
        <!-- Each tab's title is also the visible help line under the tabs (main.js markLens), so the two cannot differ. -->
        <div class="lens-nav">
          <div class="segmented" role="group" aria-label="View" aria-describedby="lens-help">
            <button data-lens="table"    aria-pressed="true"  title="The candidates as a sortable list" data-label="Table">Table</button>
            <button data-lens="ashby"    aria-pressed="false" title="Ashby chart: two properties against each other, to see the trade-offs" data-label="Ashby">Ashby</button>
            <button data-lens="parallel" aria-pressed="false" title="Each candidate across several properties at once" data-label="Parallel lines">Parallel lines</button>
            <button data-lens="coverage" aria-pressed="false" title="How much data is on file for each candidate, and where the gaps are" data-label="Data coverage">Data coverage</button>
            <button data-lens="compare"  aria-pressed="false" title="Your shortlist, property by property" data-label="Compare">Compare</button>
            <button data-lens="explain"  aria-pressed="false" id="tab-explain" title="Which requirement removed how many materials" data-label="Why excluded">Why excluded</button>
          </div>
          <p class="lens-help" id="lens-help"></p>
        </div>
      </div>
      <div class="lens-view" id="lens" tabindex="-1" role="region" aria-label="Results"></div>
    </section>
  </div>

  <footer class="statusbar">
    <span class="statusbar-idle" id="status-idle"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5M10 6.2v.1"/></svg>Set a requirement in Filters to see what passed, what failed
      and what could not be checked.</span>
    <!-- Filters, not a tally: a label that says so, and a box in each chip that is ticked while its results are shown. -->
    <span class="statusbar-label" id="statusbar-label">Show in table</span>
    <button type="button" class="chip chip-PASS"    id="s-pass"    aria-pressed="true"  aria-describedby="statusbar-label">PASS 0</button>
    <button type="button" class="chip chip-UNKNOWN" id="s-unknown" aria-pressed="false" aria-describedby="statusbar-label">UNKNOWN 0</button>
    <button type="button" class="chip chip-FAIL"    id="s-fail"    aria-pressed="false" aria-describedby="statusbar-label">FAIL 0</button>
    <button type="button" class="chip chip-screened" id="s-screened" aria-pressed="false" aria-describedby="statusbar-label" hidden>SCREENED 0</button>
    <div class="spacer"></div>
    <!-- Provenance: the data and the release every answer on the page comes from. It sat at the far end of the top bar,
         hidden below 1600 px; here it is always in sight and out of the way. -->
    <span class="meta-chip" id="meta"></span>
  </footer>

  <div class="tray" id="tray" hidden>
    <span class="label">Shortlist</span>
    <div id="pins" style="display:flex;gap:7px;flex-wrap:wrap"></div>
    <span class="tray-notice" id="tray-notice" role="status" hidden></span>
    <div class="spacer"></div>
    <button type="button" class="btn btn-sm" id="btn-chosen" hidden>Chosen products</button>
    <button type="button" class="btn btn-sm" id="btn-clear-pins">Clear all</button>
  </div>
</div>

<div id="drawer-host"></div>
<script src="js/main.js" type="module"></script>
</body>
</html>
