<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H2C Material Selector</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <h1>H2C Material Selector</h1>
    <div class="search">
      <input type="search" id="search" placeholder="Search materials, grades, families" aria-label="Search materials">
    </div>
    <div class="spacer"></div>

    <!-- The most consequential control in the product. Top level, never inside a filter group. -->
    <div class="segmented" role="group" aria-label="How to treat data that is missing">
      <button id="mode-strict" aria-pressed="true" title="Unknown or non-comparable data does not satisfy a mandatory constraint">Strict</button>
      <button id="mode-explore" aria-pressed="false" title="Explore: materials with unresolved criteria stay visible and flagged, and family estimates may rule out implausible ones.">Explore</button>
    </div>

    <label class="est-toggle" id="est-toggle" hidden
      title="Use the measured range of a material's closest relatives to rule out implausible matches. An estimate can only rule a material out, never confirm it in.">
      <input type="checkbox" id="use-estimates"><span>Estimates</span></label>

    <button class="btn btn-sm" id="btn-scenario">Scenario</button>
    <button class="btn btn-sm" id="btn-theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
    <span class="meta-chip" id="meta"></span>
  </header>

  <div class="main" id="main">
    <aside class="rail" id="rail">
      <div class="rail-head">
        <h2>Filters</h2>
        <button class="icon-btn" id="btn-reset" title="Clear all constraints">Reset</button>
      </div>
      <div id="filter-groups"></div>
    </aside>

    <section class="workspace">
      <div class="lens-bar">
        <span class="candidate-count" id="count"></span>
        <div class="spacer"></div>
        <div class="segmented" role="tablist" aria-label="View">
          <button data-lens="table"    aria-pressed="true">Table</button>
          <button data-lens="ashby"    aria-pressed="false">Ashby</button>
          <button data-lens="parallel" aria-pressed="false">Parallel</button>
          <button data-lens="coverage" aria-pressed="false">Coverage</button>
          <button data-lens="compare"  aria-pressed="false">Compare</button>
          <button data-lens="explain"  aria-pressed="false" id="tab-explain">Why excluded</button>
        </div>
      </div>
      <div class="lens-view" id="lens"></div>
    </section>
  </div>

  <footer class="statusbar">
    <span class="statusbar-label">Show</span>
    <button type="button" class="chip chip-PASS"    id="s-pass"    aria-pressed="true">PASS 0</button>
    <button type="button" class="chip chip-UNKNOWN" id="s-unknown" aria-pressed="false">UNKNOWN 0</button>
    <button type="button" class="chip chip-FAIL"    id="s-fail"    aria-pressed="false">FAIL 0</button>
    <div class="spacer"></div>
    <span class="meta-chip" id="policy-note"></span>
  </footer>

  <div class="tray" id="tray" hidden>
    <span class="label">Shortlist</span>
    <div id="pins" style="display:flex;gap:7px;flex-wrap:wrap"></div>
    <div class="spacer"></div>
    <button class="btn btn-sm" id="btn-clear-pins">Clear all</button>
  </div>
</div>

<div id="drawer-host"></div>
<script src="js/main.js" type="module"></script>
</body>
</html>
