# Verify every push to main and every pull request: data format, schema, build, tests, the source-to-HTML audit, the
# review snapshot, the interface views and 300 random rendered scenarios. Publishing (pages.yml) runs after this
# succeeds on main and only builds and deploys: the gate runs once per push, not twice. Once a week, and on demand,
# 2,000 rendered scenarios run on a new seed. A push to another branch is checked locally (npm run verify) and here
# when it is merged or opened as a pull request; the owner reduced the load on 2026-10-05 (GOALS). Node is the version
# .nvmrc names, the one local runs use, so a model refit is not a different Node's arithmetic as well (D131).

name: Verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            build/package-lock.json
            package-lock.json

      - name: Install build dependencies
        run: npm ci --prefix build

      # The import tools' own dependencies (pdfjs-dist, which the text reader imports): `verify` runs the import
      # pipeline's tests (test:ingest), which failed on every push from 2026-09-21 without them.
      - name: Install the import tools' dependencies
        run: npm ci

      # The build cache (.cache/build, build/src/build-cache.js) is never restored in CI: every result this job uses
      # is built cold once, and the audit and the reproducibility test build again with the cache off.
      - name: Start from an empty build cache
        run: rm -rf .cache/build

      # npm run verify includes the interface views (ui-probe --require) and the 300 rendered scenarios.
      - name: Verify
        run: CHROME=$(command -v google-chrome || command -v chromium) npm run verify

      - name: No deleted records since the previous commit
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then node scripts/data/diff.mjs HEAD~1 HEAD --fail-on-removed; fi

  fuzz-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            build/package-lock.json
            package-lock.json

      - name: Install build dependencies
        run: npm ci --prefix build

      # The import tools' own dependencies (pdfjs-dist, which the text reader imports): `verify` runs the import
      # pipeline's tests (test:ingest), which failed on every push from 2026-09-21 without them.
      - name: Install the import tools' dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # A new seed each run, so the nightly runs cover different scenarios; a failure names its seed and link.
      - name: 2,000 random rendered scenarios compared with the engine
        run: CHROME=$(command -v google-chrome || command -v chromium) node scripts/ui-fuzz.mjs --n 2000 --seed ${{ github.run_number }} --require --out fuzz-out

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-fuzz-violations
          path: fuzz-out/
