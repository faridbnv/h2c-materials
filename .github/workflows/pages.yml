# Build the selector from the data tables and publish it to GitHub Pages.
#
# The distributable HTML is not committed: it is rebuilt here from data/tables, so the published page can never drift
# from the source of truth. It runs once Verify (verify.yml) has passed on a push to main, on the commit Verify checked,
# so the full gate runs once per push rather than twice; the build itself still fails on any validation error, which
# means a database that has drifted stops here and never reaches the site.

name: Publish to Pages

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  # contents: write keeps each release's page as a GitHub release (D96, "Keep this release's page" below).
  contents: write
  pages: write
  id-token: write

# One deployment at a time. Never cancel one in flight, or the site can be left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only a push to main that Verify passed (or a run started by hand, which builds main as it stands).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            build/package-lock.json
            package-lock.json

      - name: Install build dependencies
        run: npm ci --prefix build

      # The import tools' own dependencies (pdfjs-dist, which the text reader imports): `verify` runs the import
      # pipeline's tests (test:ingest), which failed on every push from 2026-09-21 without them.
      - name: Install the import tools' dependencies
        run: npm ci

      # The build cache starts empty, so every build result in this job, the published one included, is computed here
      # from the tables (build/src/build-cache.js).
      - name: Start from an empty build cache
        run: rm -rf .cache/build

      # Verify passed on this commit; the build validates again on its own and stops the deploy on any error.
      - name: Build
        run: npm run build

      # A release's page is kept for good where a saved scenario can find it (D96): a GitHub release named by its ID,
      # created once, with the page and its manifest attached. The site below always serves the current release, so
      # the page of an older one is fetched from its release, never from the site.
      - name: Keep this release's page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(node -p "require('./dist/manifest.json').release")
          snapshot=$(node -p "require('./dist/manifest.json').snapshot")
          if gh release view "h2c-$id" >/dev/null 2>&1; then
            echo "Release h2c-$id is kept already"
          else
            gh release create "h2c-$id" dist/H2C_Material_Selector_*.html dist/manifest.json --target "$COMMIT" \
              --title "H2C Material Selector, release $id" \
              --notes "The page of release $id (data $snapshot), built and verified from $COMMIT. Download it and open it from disk; it needs no network."
          fi

      - name: Assemble the site
        run: |
          mkdir -p _site
          # The tool is the page: serve it at the root so the domain opens straight into it.
          cp dist/H2C_Material_Selector_*.html _site/index.html
          # Keep the release-stamped name too; an older release's page is its GitHub release's, above.
          cp dist/H2C_Material_Selector_*.html _site/
          # The validation report is a deliverable; publish it alongside.
          cp build/reports/validation-report.md _site/validation-report.md
          # What the page was built from: commit, input hashes and output hashes.
          cp dist/manifest.json _site/manifest.json
          # Tell GitHub Pages not to run the output through Jekyll.
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
