# Branch CI for the remake (WP-03; pack 07 section 8.1, pack 08 section 4.4). Runs on every pull request into remake/v3 and
# every push to it. main's verify.yml and pages.yml are not touched here (verify.yml still runs on pull requests by its own trigger; pages.yml cannot be started by this branch).
#
# Required checks to add to remake/v3's branch protection (the owner does this): next-verify, gate-old-paths, gate-tier.
# (review-section is also worth requiring.) Job names below ARE the check names, except gate-old-paths and gate-tier,
# which come from next-gate.yml.
#
# Security notes
#  - This workflow runs on `pull_request`, so a pull request runs ITS OWN copy of it: a PR that edits this file can
#    neutralise the checks it contains, including its old-paths and tier-gate jobs below. Those two are therefore advisory
#    copies. The binding gates are gate-old-paths and gate-tier in next-gate.yml, which run on `pull_request_target`
#    (always the base branch's workflow, never the PR's), never check out the PR head, and run the BASE copy of
#    remake/tools/ci-gates.mjs. A PR that edits any workflow, ci-gates.mjs or parity/corpus needs the owner's attest
#    (OWNER_GLOBS in ci-gates.mjs).
#  - No secret is referenced anywhere in this file. The deploy key lives in the `preview` environment and is used only by
#    next-preview.yml, on a push to remake/v3.
#  - Nothing from the pull request (title, body, branch name, labels) is placed inside a shell command: it travels through
#    `env:` and is read as a variable.
#  - Here, old-paths and tier-gate read the gate script and the scope files from the current tip of remake/v3 (_base), not
#    the PR, so a PR cannot approve its own scope or edit the gate it is judged by.
#  - Actions are pinned by full commit SHA.

name: Next verify

on:
  pull_request:
    branches: [remake/v3]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [remake/v3]

permissions:
  contents: read

concurrency:
  group: next-verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # ---- The checks, as parallel jobs --------------------------------------------------------------------------------------
  # One job used to run everything in a row (26 minutes). The same checks now run side by side and `next-verify`, the required
  # check, is the last job: it needs all of them and fails unless every one of them succeeded (a skipped job is a failure).
  #
  #   build-old      the old tool's build, once; its dist/ is passed on as an artifact to the jobs that read dist/db.json
  #   static         rulings check, type check, type ratchet, lint (no dist/ needed)
  #   new-tests      tests/claude and tests/remake (the round trip, the guard tests, the editor)
  #   parity-tests   tests/parity, in three shards, and tests/domain
  #   parity-noop    the binding proof: the old engine against a second copy of itself over the whole corpus
  #
  # Every job sets Node up the same way and restores node_modules from a cache keyed on the Node pin and both lock files; on a
  # cache miss it runs npm ci (which itself reads the npm download cache).

  build-old:
    name: build-old
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node is the exact version .nvmrc names (26.12.0), the one CI runs everywhere.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: build/package-lock.json

      - name: Node version in use
        run: |
          echo "node $(node --version); .nvmrc says $(cat .nvmrc)"
          test "v$(cat .nvmrc)" = "$(node --version)"

      # The build reads only its own dependencies (build/package.json), so only those are installed here.
      - name: Restore the old build's node_modules
        id: build-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/node_modules
          key: build-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'build/package-lock.json') }}

      - name: Install the old build's dependencies
        if: steps.build-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix build

      # The old tool's build: the parity harness and the domain tests read dist/db.json.
      - name: Build the old tool
        run: npm run build

      # One file, so the upload is one object and not thousands of pages. Level 1 gzip: the pages compress well, and fast matters.
      - name: Pack dist/
        run: |
          set -euo pipefail
          test -s dist/db.json
          tar --use-compress-program='gzip -1' -cf old-build.tgz dist
          ls -l old-build.tgz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: old-build
          path: old-build.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json

      - name: Node version in use
        run: |
          echo "node $(node --version); .nvmrc says $(cat .nvmrc)"
          test "v$(cat .nvmrc)" = "$(node --version)"

      - name: Restore node_modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            build/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'build/package-lock.json') }}

      - name: Install dependencies (root and the old build)
        if: steps.modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm ci --prefix build

      - name: Rulings check
        run: npm run rulings:check

      - name: Type check, type ratchet and lint
        run: |
          set -euo pipefail
          for script in types:check types:ratchet lint; do
            has=$(node -p "Boolean(require('./package.json').scripts['$script'])")
            if [ "$has" != "true" ]; then
              echo "FAIL: package.json has no $script script; it must exist, never be skipped"
              echo "$script: FAILED (no script)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          npm run types:check
          npm run types:ratchet
          npm run lint

  new-tests:
    name: new-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json

      - name: Node version in use
        run: |
          echo "node $(node --version); .nvmrc says $(cat .nvmrc)"
          test "v$(cat .nvmrc)" = "$(node --version)"

      - name: Restore node_modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            build/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'build/package-lock.json') }}

      - name: Install dependencies (root and the old build, which the new-code tests drive)
        if: steps.modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm ci --prefix build

      # These tests do not need the old build's output (the one that does, db-contract, builds it itself when it is missing),
      # so this job does not wait for build-old.
      - name: New-code tests (tests/claude, tests/remake)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/claude/*.test.mjs tests/remake/*.test.mjs)
          # node --test exits 0 when a pattern matches nothing, so the file lists are checked here.
          [ "${#files[@]}" -ge 3 ] || { echo "FAIL: only ${#files[@]} test files found under tests/claude and tests/remake"; exit 1; }
          [ -n "$(printf '%s\n' "${files[@]}" | grep '^tests/remake/ci\.test\.mjs$')" ] || { echo "FAIL: tests/remake/ci.test.mjs is missing"; exit 1; }
          node --test "${files[@]}"

  parity-tests:
    name: parity-tests (${{ matrix.shard }})
    needs: build-old
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # fault.test.mjs replays the nine faults on three worker threads and is the longest file by far.
          - shard: fault
            files: tests/parity/fault.test.mjs
          # Three heavy files that each run for minutes on their own: the impact preview (two compiles of the old build), P-build and
          # P-pages (two real builds in temporary copies of the project) and the wrapped engine against old.
          - shard: heavy
            files: tests/parity/impact.test.mjs tests/parity/build.test.mjs tests/parity/new-adapter.test.mjs
          # Every other file in tests/parity, found by listing the directory, so a new test file runs without anyone adding it
          # here; the domain tests run in this shard as well.
          - shard: rest
            files: ''
    env:
      SHARD: ${{ matrix.shard }}
      FILES: ${{ matrix.files }}
      # Every file a shard names, so the `rest` shard can leave exactly those out.
      NAMED: tests/parity/fault.test.mjs tests/parity/impact.test.mjs tests/parity/build.test.mjs tests/parity/new-adapter.test.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json

      - name: Node version in use
        run: |
          echo "node $(node --version); .nvmrc says $(cat .nvmrc)"
          test "v$(cat .nvmrc)" = "$(node --version)"

      - name: Restore node_modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            build/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'build/package-lock.json') }}

      - name: Install dependencies (root and the old build, which the parity tests drive)
        if: steps.modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm ci --prefix build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: old-build

      - name: Unpack the old tool's build (dist/)
        run: |
          set -euo pipefail
          tar -xzf old-build.tgz
          test -s dist/db.json

      - name: Parity tests
        run: |
          set -euo pipefail
          if ! compgen -G 'tests/parity/*.test.mjs' >/dev/null; then
            echo "FAIL: tests/parity/*.test.mjs is missing; the parity tests must run, never be skipped"
            echo "parity tests: FAILED (tests/parity missing)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # A shard that names a file that is gone (renamed, deleted) fails here; it never quietly runs less.
          for f in $NAMED; do
            test -f "$f" || { echo "FAIL: $f is named by a shard of this job but does not exist"; exit 1; }
          done
          files="$FILES"
          if [ -z "$files" ]; then
            for f in tests/parity/*.test.mjs; do
              case " $NAMED " in *" $f "*) ;; *) files="$files $f" ;; esac
            done
          fi
          [ -n "${files// /}" ] || { echo "FAIL: shard $SHARD has no test files to run"; exit 1; }
          echo "parity tests, shard $SHARD:$files" | tee -a "$GITHUB_STEP_SUMMARY"
          node --test --test-concurrency=4 $files

      - name: Domain tests (contracts and shared core)
        if: matrix.shard == 'rest'
        run: |
          set -euo pipefail
          if ! compgen -G 'tests/domain/*.test.mjs' >/dev/null; then
            echo "FAIL: tests/domain/*.test.mjs is missing; the domain tests must run, never be skipped"
            echo "domain tests: FAILED (tests/domain missing)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node --test 'tests/domain/*.test.mjs'

  # The binding parity proof on this branch: the old engine against a second, independent copy of itself over the whole
  # corpus (1,306 questions) must show exactly 0 differences. Any difference, any not-computable case, any crash fails.
  parity-noop:
    name: parity-noop
    needs: build-old
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json

      - name: Node version in use
        run: |
          echo "node $(node --version); .nvmrc says $(cat .nvmrc)"
          test "v$(cat .nvmrc)" = "$(node --version)"

      - name: Restore node_modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            build/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'build/package-lock.json') }}

      - name: Install dependencies (root and the old build, which the parity run drives)
        if: steps.modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm ci --prefix build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: old-build

      - name: Unpack the old tool's build (dist/)
        run: |
          set -euo pipefail
          tar -xzf old-build.tgz
          test -s dist/db.json

      - name: Parity, old against old (npm run parity -- --noop)
        run: |
          set -uo pipefail
          start=$(date +%s)
          rc=0
          npm run parity -- --noop | tee parity-noop.out || rc=$?
          secs=$(( $(date +%s) - start ))
          result=$(grep '^RESULT:' parity-noop.out || echo 'RESULT: none printed')
          echo "parity --noop: exit $rc, $result, $secs s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ] || [ "$result" != "RESULT: zero" ]; then
            echo "FAIL: parity --noop must exit 0 with RESULT: zero (exit $rc, $result)"; exit 1
          fi

  # The required check. It runs when the others have finished, whatever they did, and is green only if every one of them
  # succeeded: a failed, cancelled or skipped job is a red next-verify, so nothing can be dropped by skipping it.
  next-verify:
    name: next-verify
    needs: [build-old, static, new-tests, parity-tests, parity-noop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - name: Every part of next-verify must have succeeded
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          expected="build-old new-tests parity-noop parity-tests static"
          seen=$(echo "$NEEDS" | jq -r 'keys | join(" ")')
          if [ "$seen" != "$expected" ]; then echo "FAIL: next-verify saw the jobs '$seen', expected '$expected'"; exit 1; fi
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' | paste -sd' ' -)
          if [ -n "$bad" ]; then echo "FAIL: not green: $bad"; echo "next-verify: FAILED ($bad)" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          echo "next-verify: all five parts succeeded" >> "$GITHUB_STEP_SUMMARY"

      - name: Say which optional checks ran
        if: github.event_name == 'pull_request'
        run: |
          case ",$LABELS," in
            *,full-checks,*) echo "full-checks label: present, legacy-fast and the weekly-class jobs run." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "full-checks label: absent, so legacy-fast and the weekly-class checks are NOT RUN on this PR." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  old-paths:
    name: old-paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: remake/v3
          path: _base
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Fail if the PR changes a path main owns
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt
          n=$(wc -l < changed.txt)
          if [ "$n" -ge 3000 ]; then echo "FAIL: the PR lists $n files, at the API's 3000 cap; cannot judge it"; exit 1; fi
          gate=remake/tools/ci-gates.mjs
          if [ -f "_base/$gate" ]; then gate="_base/$gate"; else echo "note: remake/v3 has no $gate yet (bootstrap PR); using the PR's copy"; fi
          rc=0; node "$gate" old-paths --files changed.txt > gate.out || rc=$?
          cat gate.out; cat gate.out >> "$GITHUB_STEP_SUMMARY"
          test -s gate.out
          exit $rc

  review-section:
    name: review-section
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: remake/v3
          path: _base
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Require "Review findings and disposition" where the pack asks for it
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt
          n=$(wc -l < changed.txt)
          if [ "$n" -ge 3000 ]; then echo "FAIL: the PR lists $n files, at the API's 3000 cap; cannot judge it"; exit 1; fi
          gate=remake/tools/ci-gates.mjs
          if [ -f "_base/$gate" ]; then gate="_base/$gate"; else echo "note: remake/v3 has no $gate yet (bootstrap PR); using the PR's copy"; fi
          rc=0; node "$gate" review-section --files changed.txt --body-env PR_BODY > gate.out || rc=$?
          cat gate.out; cat gate.out >> "$GITHUB_STEP_SUMMARY"
          test -s gate.out
          exit $rc

  tier-gate:
    name: tier-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: remake/v3
          path: _base
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Tier 0 only inside an owner-approved scope with no science or governance path; otherwise Tier 1, which passes only
      # with the owner's `wp:attest approve <PR> <headSHA>` comment for the CURRENT head. The comments are read now, not
      # from the event, so after the owner attests, "Re-run jobs" on this check turns it green.
      - name: Classify the PR and check the owner's attest
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [ "$current" != "$EVENT_HEAD" ]; then
            echo "FAIL: this run is for ${EVENT_HEAD:0:8} but the PR head is now ${current:0:8}; the newer run decides"; exit 1
          fi
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt
          n=$(wc -l < changed.txt)
          if [ "$n" -ge 3000 ]; then echo "FAIL: the PR lists $n files, at the API's 3000 cap; cannot judge it"; exit 1; fi
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" | jq -s 'add // []' > comments.json
          gate=remake/tools/ci-gates.mjs; scopes=_base/remake/scopes
          if [ -f "_base/$gate" ]; then gate="_base/$gate"; else echo "note: remake/v3 has no $gate yet (bootstrap PR); using the PR's copy"; fi
          rc=0; node "$gate" tier --files changed.txt --scopes-dir "$scopes" --pr "$PR_NUMBER" --head "$current" --owner "$OWNER" --comments comments.json > gate.out || rc=$?
          cat gate.out; cat gate.out >> "$GITHUB_STEP_SUMMARY"
          test -s gate.out
          exit $rc

  legacy-fast:
    name: legacy-fast
    # The old gate's fast loop, only when asked for with the `full-checks` label (main is frozen; verify.yml is not copied).
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-checks')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            build/package-lock.json
            package-lock.json
      - run: npm ci --prefix build
      - run: npm ci
      - name: Start from an empty build cache
        run: rm -rf .cache/build && sleep 3
      - name: verify:fast
        run: npm run verify:fast

  # The weekly-class checks of verify.yml (scale and reproducible build; 2,000 rendered scenarios, i.e. ui:fuzz:full), on a
  # pull_request event because scheduled workflows run only from the default branch. Label `full-checks`.
  full-trend:
    name: full-checks (scale and reproducible)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-checks')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            build/package-lock.json
            package-lock.json
      - run: npm ci --prefix build
      - run: npm ci
      - name: Start from an empty build cache
        run: rm -rf .cache/build && sleep 3
      - name: Scale and reproducibility
        run: node scripts/verify.mjs --group trend --enforce-budget

  full-fuzz:
    name: full-checks (ui:fuzz:full ${{ matrix.part }} of 4)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-checks')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    env:
      PART: ${{ matrix.part }}
      SEED: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            build/package-lock.json
            package-lock.json
      - run: npm ci --prefix build
      - run: npm ci
      - run: npm run build
      - name: 2,000 random rendered scenarios, one part of four
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium) || { echo "FAIL: no Chrome or Chromium on the runner"; exit 1; }
          export CHROME
          npm run ui:fuzz:full -- --seed "$SEED" --shard "$PART/4" --require --out fuzz-out
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-fuzz-violations-${{ matrix.part }}
          path: fuzz-out/
