# Branch CI for the remake (WP-03; pack 07 section 8.1, pack 08 section 4.4). Runs on every pull request into remake/v3 and
# every push to it. main's verify.yml and pages.yml are not touched and cannot be started by this branch.
#
# Required checks to add to remake/v3's branch protection (the owner does this): next-verify, old-paths, tier-gate.
# (review-section is also worth requiring.) Job names below ARE the check names.
#
# Security notes
#  - Only `pull_request` (never `pull_request_target`): a fork's code gets a read-only token and no secrets.
#  - No secret is referenced anywhere in this file. The deploy key lives in the `preview` environment and is used only by
#    next-preview.yml, on a push to remake/v3.
#  - Nothing from the pull request (title, body, branch name, labels) is placed inside a shell command: it travels through
#    `env:` and is read as a variable.
#  - tier-gate and old-paths read the gate script and the scope files from the current tip of remake/v3 (not the PR), so a PR cannot approve its own
#    scope or edit the gate it is judged by. (A PR that edits this workflow is a governance change: it is Tier 1, so the
#    owner reads it before attesting.)
#  - Actions are pinned by full commit SHA.

name: Next verify

on:
  pull_request:
    branches: [remake/v3]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [remake/v3]

permissions:
  contents: read

concurrency:
  group: next-verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  next-verify:
    name: next-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node is the exact version .nvmrc names (26.12.0), the one CI runs everywhere.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Node version in use
        run: |
          echo "node $(node --version); .nvmrc says $(cat .nvmrc)"
          test "v$(cat .nvmrc)" = "$(node --version)"

      - name: New-code tests (tests/claude, tests/remake)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/claude/*.test.mjs tests/remake/*.test.mjs)
          # node --test exits 0 when a pattern matches nothing, so the file lists are checked here.
          [ "${#files[@]}" -ge 3 ] || { echo "FAIL: only ${#files[@]} test files found under tests/claude and tests/remake"; exit 1; }
          [ -n "$(printf '%s\n' "${files[@]}" | grep '^tests/remake/ci\.test\.mjs$')" ] || { echo "FAIL: tests/remake/ci.test.mjs is missing"; exit 1; }
          node --test "${files[@]}"

      - name: Parity tests
        run: |
          if compgen -G 'tests/parity/*.test.mjs' >/dev/null; then
            node --test 'tests/parity/*.test.mjs'
          else
            echo "parity tests: NOT RUN (tests/parity does not exist yet; the parity harness arrives with WP-05)"
            echo "parity tests: NOT RUN (no tests/parity yet)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rulings check
        run: npm run rulings:check

      - name: Type check
        run: |
          has=$(node -p "Boolean(require('./package.json').scripts['types:check'])")
          if [ "$has" = "true" ]; then
            npm run types:check
          else
            echo "types:check: NOT RUN (no types:check script yet; the TypeScript toolchain arrives with WP-06)"
            echo "types:check: NOT RUN (no script yet, WP-06)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Say which optional checks ran
        if: github.event_name == 'pull_request'
        run: |
          case ",$LABELS," in
            *,full-checks,*) echo "full-checks label: present, legacy-fast and the weekly-class jobs run." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "full-checks label: absent, so legacy-fast and the weekly-class checks are NOT RUN on this PR." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  old-paths:
    name: old-paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: remake/v3
          path: _base
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Fail if the PR changes a path main owns
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt
          n=$(wc -l < changed.txt)
          if [ "$n" -ge 3000 ]; then echo "FAIL: the PR lists $n files, at the API's 3000 cap; cannot judge it"; exit 1; fi
          gate=remake/tools/ci-gates.mjs
          if [ -f "_base/$gate" ]; then gate="_base/$gate"; else echo "note: remake/v3 has no $gate yet (bootstrap PR); using the PR's copy"; fi
          rc=0; node "$gate" old-paths --files changed.txt > gate.out || rc=$?
          cat gate.out; cat gate.out >> "$GITHUB_STEP_SUMMARY"
          test -s gate.out
          exit $rc

  review-section:
    name: review-section
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: remake/v3
          path: _base
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Require "Review findings and disposition" where the pack asks for it
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt
          n=$(wc -l < changed.txt)
          if [ "$n" -ge 3000 ]; then echo "FAIL: the PR lists $n files, at the API's 3000 cap; cannot judge it"; exit 1; fi
          gate=remake/tools/ci-gates.mjs
          if [ -f "_base/$gate" ]; then gate="_base/$gate"; else echo "note: remake/v3 has no $gate yet (bootstrap PR); using the PR's copy"; fi
          rc=0; node "$gate" review-section --files changed.txt --body-env PR_BODY > gate.out || rc=$?
          cat gate.out; cat gate.out >> "$GITHUB_STEP_SUMMARY"
          test -s gate.out
          exit $rc

  tier-gate:
    name: tier-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: remake/v3
          path: _base
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Tier 0 only inside an owner-approved scope with no science or governance path; otherwise Tier 1, which passes only
      # with the owner's `wp:attest approve <PR> <headSHA>` comment for the CURRENT head. The comments are read now, not
      # from the event, so after the owner attests, "Re-run jobs" on this check turns it green.
      - name: Classify the PR and check the owner's attest
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [ "$current" != "$EVENT_HEAD" ]; then
            echo "FAIL: this run is for ${EVENT_HEAD:0:8} but the PR head is now ${current:0:8}; the newer run decides"; exit 1
          fi
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt
          n=$(wc -l < changed.txt)
          if [ "$n" -ge 3000 ]; then echo "FAIL: the PR lists $n files, at the API's 3000 cap; cannot judge it"; exit 1; fi
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" | jq -s 'add // []' > comments.json
          gate=remake/tools/ci-gates.mjs; scopes=_base/remake/scopes
          if [ -f "_base/$gate" ]; then gate="_base/$gate"; else echo "note: remake/v3 has no $gate yet (bootstrap PR); using the PR's copy"; fi
          rc=0; node "$gate" tier --files changed.txt --scopes-dir "$scopes" --pr "$PR_NUMBER" --head "$current" --owner "$OWNER" --comments comments.json > gate.out || rc=$?
          cat gate.out; cat gate.out >> "$GITHUB_STEP_SUMMARY"
          test -s gate.out
          exit $rc

  legacy-fast:
    name: legacy-fast
    # The old gate's fast loop, only when asked for with the `full-checks` label (main is frozen; verify.yml is not copied).
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-checks')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            build/package-lock.json
            package-lock.json
      - run: npm ci --prefix build
      - run: npm ci
      - name: Start from an empty build cache
        run: rm -rf .cache/build && sleep 3
      - name: verify:fast
        run: npm run verify:fast

  # The weekly-class checks of verify.yml (scale and reproducible build; 2,000 rendered scenarios, i.e. ui:fuzz:full), on a
  # pull_request event because scheduled workflows run only from the default branch. Label `full-checks`.
  full-trend:
    name: full-checks (scale and reproducible)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-checks')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            build/package-lock.json
            package-lock.json
      - run: npm ci --prefix build
      - run: npm ci
      - name: Start from an empty build cache
        run: rm -rf .cache/build && sleep 3
      - name: Scale and reproducibility
        run: node scripts/verify.mjs --group trend --enforce-budget

  full-fuzz:
    name: full-checks (ui:fuzz:full ${{ matrix.part }} of 4)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-checks')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    env:
      PART: ${{ matrix.part }}
      SEED: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            build/package-lock.json
            package-lock.json
      - run: npm ci --prefix build
      - run: npm ci
      - run: npm run build
      - name: 2,000 random rendered scenarios, one part of four
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium) || { echo "FAIL: no Chrome or Chromium on the runner"; exit 1; }
          export CHROME
          npm run ui:fuzz:full -- --seed "$SEED" --shard "$PART/4" --require --out fuzz-out
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-fuzz-violations-${{ matrix.part }}
          path: fuzz-out/
